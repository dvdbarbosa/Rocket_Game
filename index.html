<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Hunter Space — Debug PlayFab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    html, body { height:100%; margin:0; background:#000; color:#fff; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .wrap { display:flex; gap:12px; padding:12px; align-items:flex-start; }
    .frame { width:800px; height:600px; background:#000; border:1px solid #222; }
    .panel { width:340px; background:#0d0d0d; border:1px solid #222; padding:10px; box-sizing:border-box; font-size:13px; }
    .panel h4 { margin:6px 0 8px 0; font-size:14px; }
    .kv { display:flex; justify-content:space-between; padding:2px 0; }
    .small { font-size:12px; color:#bbb; }
    button { padding:6px 8px; margin-top:6px; }
    textarea { width:100%; height:120px; background:#071018; color:#bfe; border:1px solid #163; padding:6px; box-sizing:border-box; font-family:monospace; font-size:12px; }
    .ok { color:#7df27d; } .err { color:#ff7b7b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame" id="game-container"></div>

    <div class="panel" id="debugPanel">
      <h4>PlayFab Debug Panel</h4>
      <div class="kv"><span>TitleId</span><span id="dbgTitle">15ac49</span></div>
      <div class="kv"><span>customId</span><span id="dbgCustom">-</span></div>
      <div class="kv"><span>playFabId</span><span id="dbgPlayFabId">-</span></div>
      <div class="kv"><span>sessionTicket</span><span id="dbgTicket">-</span></div>
      <div class="kv"><span>last status</span><span id="dbgStatus">-</span></div>
      <div style="margin-top:8px;">
        <button id="btnForceLogin">Forçar Login</button>
        <button id="btnGetTop10">Pegar Top10</button>
        <button id="btnClearLog">Limpar Log</button>
      </div>

      <h4>Logs / Última resposta</h4>
      <textarea id="pfLog" readonly></textarea>
    </div>
  </div>

  <!-- overlay fallback for leaderboard -->
  <div id="pfOverlay" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:9999;">
    <div style="width:360px;max-height:80vh;overflow:auto;background:#111;border:2px solid #444;padding:14px;color:#fff;font-family:monospace;box-shadow:0 8px 24px rgba(0,0,0,0.7);">
      <h3 style="margin:0 0 8px 0;font-size:16px;">Leaderboard (online)</h3>
      <pre id="pfOverlayText" style="white-space:pre-wrap;margin:0;font-size:13px;color:#bfe">Carregando...</pre>
      <div style="text-align:right;margin-top:8px;"><button id="pfOverlayClose">Fechar</button></div>
    </div>
  </div>

  <script>
  // ---------- Ruffle player (carrega o SWF) ----------
  window.addEventListener("DOMContentLoaded", () => {
    const ruffle = window.RufflePlayer && window.RufflePlayer.newest ? window.RufflePlayer.newest() : null;
    const container = document.getElementById("game-container");
    if (!ruffle) {
      container.innerHTML = "Não foi possível carregar o Ruffle.";
      return;
    }
    const player = ruffle.createPlayer();
    player.id = "game";
    container.appendChild(player);
    player.style.width = "100%";
    player.style.height = "100%";
    player.tabIndex = 0;
    setTimeout(()=>{ try{ player.focus(); }catch(e){} }, 500);
    container.addEventListener("click", ()=> { try{ player.focus(); }catch(e){} });

    // Carregue seu SWF (coloque rocket_game.swf no mesmo diretório)
    player.load("rocket_game.swf");
  });

  // ---------- PlayFab IIFE ----------
  (function(){
    // Use seu Title ID: o hostname usa a versão lowercase para roteamento
    const ORIGINAL_TITLE_ID = "15AC49"; // conforme PlayFab Game Manager
    const TITLE_ID = ORIGINAL_TITLE_ID.toLowerCase(); // "15ac49" para montar hostname
    const BASE_URL = "https://" + TITLE_ID + ".playfabapi.com";

    // state
    let sessionTicket = "";
    let playFabId = "";
    let customId = localStorage.getItem("pf_customId") || ("player_" + Math.floor(Math.random()*99999999));
    localStorage.setItem("pf_customId", customId);
    let lastResponse = null;

    // UI refs
    const dbgCustom = document.getElementById("dbgCustom");
    const dbgPlayFabId = document.getElementById("dbgPlayFabId");
    const dbgTicket = document.getElementById("dbgTicket");
    const dbgStatus = document.getElementById("dbgStatus");
    const pfLog = document.getElementById("pfLog");
    const overlay = document.getElementById("pfOverlay");
    const overlayText = document.getElementById("pfOverlayText");
    document.getElementById("pfOverlayClose").addEventListener("click", ()=> overlay.style.display = "none");

    function log(...args) {
      console.log.apply(console, args);
      try {
        const line = args.map(a => (typeof a === "object" ? JSON.stringify(a) : String(a))).join(" ");
        pfLog.value = (pfLog.value ? pfLog.value + "\n" : "") + line;
        pfLog.scrollTop = pfLog.scrollHeight;
      } catch(e){}
    }

    function setDebugFields() {
      dbgCustom.textContent = customId;
      dbgPlayFabId.textContent = playFabId || "-";
      dbgTicket.textContent = sessionTicket ? "[present]" : "-";
      dbgStatus.textContent = lastResponse ? (lastResponse.status + (lastResponse.tag ? " ("+lastResponse.tag+")" : "")) : "-";
    }

    // wrapper do fetch que faz retry em 401 (re-login) uma vez
    async function pfPost(endpoint, body, ticket, opts) {
      opts = opts || {};
      const tag = opts.tag || "";
      const makeRequest = async (tk) => {
        const url = BASE_URL + endpoint;
        // NÃO incluir X-PlayFabTitleId; apenas Content-Type e opcional X-Authorization
        const headers = { "Content-Type": "application/json" };
        if (tk) headers["X-Authorization"] = tk;
        try {
          log("[PlayFab JS] POST", url, "tag:", tag, "body:", body, "headers:", { XAuthorization: !!tk });
          const resp = await fetch(url, { method:"POST", headers, body: JSON.stringify(body) });
          let json = null;
          try { json = await resp.json(); } catch(_){}
          lastResponse = { status: resp.status, json: json, endpoint:endpoint, tag: tag };
          setDebugFields();
          log(`[PlayFab JS] ${endpoint} → status ${resp.status}`, { body: body, resp: json });
          return { status: resp.status, json: json, respObj: resp };
        } catch (err) {
          lastResponse = { status:0, error:String(err), endpoint:endpoint };
          setDebugFields();
          log("[PlayFab JS] Fetch error", err);
          return { status:0, json:null, error:err };
        }
      };

      // first try
      let r = await makeRequest(ticket);

      // if 401, try re-login once automatically (common case: expired/invalid ticket)
      if (r.status === 401 && !opts._retried) {
        log("[PlayFab JS] 401 detected, trying automatic re-login...");
        await login(customId, { silent:true });
        // attempt again with new ticket
        opts._retried = true;
        r = await makeRequest(sessionTicket);
      }
      return r;
    }

    // helper: try to call AS3 SWF callbacks
    function callAs3IfAvailable(fnName, argObj) {
      try {
        const arg = JSON.stringify(argObj || {});
        // try global function first
        if (typeof window[fnName] === "function") { window[fnName](arg); return true; }
        const elem = document.getElementById("game");
        if (elem && typeof elem[fnName] === "function") { try { elem[fnName](arg); return true; } catch(_){} }
        // For Ruffle, custom method access can fail; also try parent
        if (window.parent && typeof window.parent[fnName] === "function") { window.parent[fnName](arg); return true; }
      } catch (err) {
        console.warn("[PlayFab JS] callAs3IfAvailable error:", err);
      }
      return false;
    }

    // show overlay list
    function showLeaderboardOverlay(entries) {
      if (!entries || entries.length === 0) overlayText.textContent = "Nenhum resultado.";
      else {
        let out = "";
        for (let i=0;i<entries.length;i++) {
          const e = entries[i];
          const name = e.DisplayName || e.PlayFabId || "id";
          const val = (e.StatValue !== undefined) ? e.StatValue : (e.Value !== undefined ? e.Value : 0);
          out += (i+1) + ". " + name + " — " + val + "\n";
        }
        overlayText.textContent = out;
      }
      overlay.style.display = "flex";
    }

    // --- Core actions ---

    async function login(cid, opts) {
      opts = opts || {};
      if (cid) { customId = cid; localStorage.setItem("pf_customId", customId); }
      try {
        // Use ORIGINAL_TITLE_ID in the body (same as your PlayFab Game Manager)
        const body = { TitleId: ORIGINAL_TITLE_ID, CustomId: customId, CreateAccount: true, InfoRequestParameters: { GetUserAccountInfo: true } };
        const r = await pfPost("/Client/LoginWithCustomID", body, null, { tag:"login" });
        if (r.status === 200 && r.json && r.json.data) {
          sessionTicket = r.json.data.SessionTicket || "";
          playFabId = r.json.data.PlayFabId || "";
          callAs3IfAvailable("onPlayFabLogin", { ok:true, data: r.json.data });
          setDebugFields();
          // after login, try to fetch user data or leaderboard if needed
          try { getUserData(); } catch(_){}
        } else {
          sessionTicket = "";
          playFabId = "";
          callAs3IfAvailable("onPlayFabLogin", { ok:false, error: r.json || { status:r.status } });
          setDebugFields();
          log("[PlayFab JS] login failed", r);
        }
        return r;
      } catch (err) {
        log("[PlayFab JS] login error", err);
        callAs3IfAvailable("onPlayFabLogin", { ok:false, error:String(err) });
        return { status:0, error:err };
      }
    }

    async function submitScore(score,kills,level) {
      const body = { Statistics: [
        { StatisticName:"Score", Value: parseInt(score||0) },
        { StatisticName:"Kills", Value: parseInt(kills||0) },
        { StatisticName:"Level", Value: parseInt(level||0) }
      ]};
      const r = await pfPost("/Client/UpdatePlayerStatistics", body, sessionTicket, { tag:"submitScore" });
      callAs3IfAvailable("onSubmitScoreResult", { status: r.status, json: r.json });
      return r;
    }

    async function getTopN(statName, n) {
      const body = { StatisticName: statName, StartPosition: 0, MaxResultsCount: n };
      const r = await pfPost("/Client/GetLeaderboard", body, sessionTicket, { tag:"getTopN" });
      if (r.status === 200 && r.json && r.json.data && r.json.data.Leaderboard) {
        callAs3IfAvailable("onLeaderboardResult", { ok:true, entries: r.json.data.Leaderboard });
        showLeaderboardOverlay(r.json.data.Leaderboard);
      } else {
        callAs3IfAvailable("onLeaderboardResult", { ok:false, error: r.json || { status:r.status } });
        log("[PlayFab JS] getTopN failed", r);
      }
      return r;
    }

    // Ensure login before setting display name
    async function setDisplayName(displayName) {
      if (!sessionTicket) {
        log("[PlayFab JS] No sessionTicket — logging in before setDisplayName...");
        const loginRes = await login(customId);
        if (!loginRes || loginRes.status !== 200) {
          log("[PlayFab JS] Cannot set display name because login failed", loginRes);
          callAs3IfAvailable("onSetDisplayNameResult", { status:0, error:"LoginFailed" });
          return loginRes || { status:0 };
        }
      }
      const body = { DisplayName: String(displayName) };
      const r = await pfPost("/Client/UpdateUserTitleDisplayName", body, sessionTicket, { tag:"setDisplayName" });
      callAs3IfAvailable("onSetDisplayNameResult", { status: r.status, json: r.json });
      return r;
    }

    async function getUserData() {
      const r = await pfPost("/Client/GetUserData", {}, sessionTicket, { tag:"getUserData" });
      if (r.status === 200 && r.json && r.json.data) {
        const data = r.json.data.Data || {};
        callAs3IfAvailable("onUserDataResult", { ok:true, data: data });
      } else {
        callAs3IfAvailable("onUserDataResult", { ok:false, error: r.json || { status:r.status } });
      }
      return r;
    }

    async function saveUserData(key, value) {
      const body = { Data: {} };
      body.Data[key] = String(value);
      const r = await pfPost("/Client/UpdateUserData", body, sessionTicket, { tag:"saveUserData" });
      callAs3IfAvailable("onSaveUserDataResult", { status:r.status, json:r.json });
      return r;
    }

    // expose for AS3 (ExternalInterface.call)
    window.playfabLoginFromPage = (cid) => login(cid);
    window.playfabSubmitScore = (score,kills,level) => submitScore(score,kills,level);
    window.playfabGetTopN = (statName,n) => getTopN(statName,n);
    window.playfabSetDisplayName = (displayName) => setDisplayName(displayName);
    window.playfabSaveUserData = (key,value) => saveUserData(key,value);
    window.playfabGetUserData = () => getUserData();

    // debugging helpers
    window._pf_debug = {
      getSessionTicket: ()=> sessionTicket,
      getPlayFabId: ()=> playFabId,
      getCustomId: ()=> customId,
      lastResponse: ()=> lastResponse
    };

    // auto-login on page load
    window.addEventListener('load', function(){ login(); });

    // UI buttons
    document.getElementById("btnForceLogin").addEventListener("click", ()=> login(customId));
    document.getElementById("btnGetTop10").addEventListener("click", ()=> getTopN("Score", 10));
    document.getElementById("btnClearLog").addEventListener("click", ()=> { pfLog.value = ""; });

    // initial debug values
    setDebugFields();

  })();
  </script>
</body>
</html>
