<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Hunter Space — Debug PlayFab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Ruffle carregado do CDN oficial com fallback -->
  <script>
    (function() {
      const cdns = [
        "https://unpkg.com/@ruffle-rs/ruffle",
        "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"
      ];
      let idx = 0;
      function tryLoad() {
        if (idx >= cdns.length) {
          document.addEventListener("DOMContentLoaded", function() {
            const c = document.getElementById("game-container");
            if (c) c.innerHTML = "<p style='color:#f88;padding:16px'>Erro: não foi possível carregar o Ruffle de nenhuma fonte CDN.<br>Verifique sua conexão ou hospede o Ruffle localmente.</p>";
          });
          return;
        }
        const s = document.createElement("script");
        s.src = cdns[idx];
        s.onload  = function() { console.log("[Ruffle] carregado de:", cdns[idx]); };
        s.onerror = function() { console.warn("[Ruffle] falhou:", cdns[idx]); idx++; tryLoad(); };
        document.head.appendChild(s);
      }
      tryLoad();
    })();
  </script>
  <style>
    html, body { height:100%; margin:0; background:#000; color:#fff; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .wrap { display:flex; gap:12px; padding:12px; align-items:flex-start; }
    .frame { width:800px; height:600px; background:#000; border:1px solid #222; }
    .panel { width:340px; background:#0d0d0d; border:1px solid #222; padding:10px; box-sizing:border-box; font-size:13px; }
    .panel h4 { margin:6px 0 8px 0; font-size:14px; }
    .kv { display:flex; justify-content:space-between; padding:2px 0; }
    .small { font-size:12px; color:#bbb; }
    button { padding:6px 8px; margin-top:6px; }
    textarea { width:100%; height:120px; background:#071018; color:#bfe; border:1px solid #163; padding:6px; box-sizing:border-box; font-family:monospace; font-size:12px; }
    .ok { color:#7df27d; } .err { color:#ff7b7b; }
    #pfNotice { margin-top:8px; padding:8px; border-radius:6px; background:#111; color:#ddd; font-size:13px; min-height:34px; display:flex; align-items:center; }
    #pfNotice.warn  { background:#3b2a00; color:#ffd87a; }
    #pfNotice.error { background:#2a0000; color:#ffbdbd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame" id="game-container"></div>

    <div class="panel" id="debugPanel">
      <h4>PlayFab Debug Panel</h4>
      <div class="kv"><span>TitleId</span><span id="dbgTitle">15AC49</span></div>
      <div class="kv"><span>customId</span><span id="dbgCustom">-</span></div>
      <div class="kv"><span>playFabId</span><span id="dbgPlayFabId">-</span></div>
      <div class="kv"><span>sessionTicket</span><span id="dbgTicket">-</span></div>
      <div class="kv"><span>last status</span><span id="dbgStatus">-</span></div>

      <div style="margin-top:8px;">
        <button id="btnForceLogin">Forçar Login</button>
        <button id="btnGetTop10">Pegar Top10</button>
        <button id="btnClearLog">Limpar Log</button>
      </div>

      <div id="pfNotice">Status: aguardando ações.</div>

      <h4 style="margin-top:10px">Logs / Última resposta</h4>
      <textarea id="pfLog" readonly></textarea>
    </div>
  </div>

  <!-- Overlay do leaderboard -->
  <div id="pfOverlay" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:9999;">
    <div style="width:360px;max-height:80vh;overflow:auto;background:#111;border:2px solid #444;padding:14px;color:#fff;font-family:monospace;box-shadow:0 8px 24px rgba(0,0,0,0.7);">
      <h3 style="margin:0 0 8px 0;font-size:16px;">Leaderboard (online)</h3>
      <pre id="pfOverlayText" style="white-space:pre-wrap;margin:0;font-size:13px;color:#bfe">Carregando...</pre>
      <div style="text-align:right;margin-top:8px;"><button id="pfOverlayClose">Fechar</button></div>
    </div>
  </div>

  <script>
  // ─── Ruffle: carrega o SWF ────────────────────────────────────────────────
  // Tenta iniciar o Ruffle — aguarda até 8s pelo script CDN
  function initRuffle() {
    const container = document.getElementById("game-container");
    if (!container) return;

    if (window.RufflePlayer && window.RufflePlayer.newest) {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.id           = "game";
      player.style.width  = "100%";
      player.style.height = "100%";
      player.tabIndex     = 0;
      container.innerHTML = "";
      container.appendChild(player);

      setTimeout(() => { try { player.focus(); } catch(_){} }, 500);
      container.addEventListener("click", () => { try { player.focus(); } catch(_){} });

      // Carrega o SWF (coloque rocket_game.swf no mesmo diretório)
      player.load("rocket_game.swf");
      console.log("[Ruffle] player iniciado.");
    } else {
      container.innerHTML =
        "<p style='color:#f88;padding:20px;font-size:14px'>" +
        "❌ Ruffle não carregou ainda. Verifique o console (F12) para detalhes de rede.</p>";
    }
  }

  // Aguarda o DOM e dá tempo ao script CDN de baixar (máx 8s)
  document.addEventListener("DOMContentLoaded", function() {
    let waited = 0;
    const interval = setInterval(function() {
      waited += 200;
      if (window.RufflePlayer && window.RufflePlayer.newest) {
        clearInterval(interval);
        initRuffle();
      } else if (waited >= 8000) {
        clearInterval(interval);
        initRuffle(); // mostra mensagem de erro
      }
    }, 200);
  });

  // ─── PlayFab IIFE ─────────────────────────────────────────────────────────
  (function () {
    const ORIGINAL_TITLE_ID = "15AC49";           // exato do Game Manager
    const TITLE_ID          = ORIGINAL_TITLE_ID.toLowerCase(); // hostname
    const BASE_URL          = "https://" + TITLE_ID + ".playfabapi.com";

    // ✅ JS-1 CORRIGIDO — getStorage/setStorage com fallback para sessionStorage
    function getStorage(key) {
      try { return localStorage.getItem(key); } catch (_) {}
      try { return sessionStorage.getItem(key); } catch (_) {}
      return null;
    }
    function setStorage(key, value) {
      try { localStorage.setItem(key, value); return; } catch (_) {}
      try { sessionStorage.setItem(key, value); } catch (_) {}
    }

    // Estado
    let sessionTicket = "";
    let playFabId     = "";
    let customId      = getStorage("pf_customId") || ("player_" + Math.floor(Math.random() * 99999999));
    setStorage("pf_customId", customId);

    let lastResponse  = null;
    let isLoggingIn   = false; // evita logins concorrentes

    // Refs de UI
    const dbgCustom    = document.getElementById("dbgCustom");
    const dbgPlayFabId = document.getElementById("dbgPlayFabId");
    const dbgTicket    = document.getElementById("dbgTicket");
    const dbgStatus    = document.getElementById("dbgStatus");
    const pfLog        = document.getElementById("pfLog");
    const pfNotice     = document.getElementById("pfNotice");
    const overlay      = document.getElementById("pfOverlay");
    const overlayText  = document.getElementById("pfOverlayText");

    document.getElementById("pfOverlayClose")
      .addEventListener("click", () => overlay.style.display = "none");

    // ── Helpers de UI ──────────────────────────────────────────────────────
    function log(...args) {
      console.log(...args);
      try {
        const line = args.map(a => typeof a === "object" ? JSON.stringify(a) : String(a)).join(" ");
        pfLog.value = (pfLog.value ? pfLog.value + "\n" : "") + line;
        pfLog.scrollTop = pfLog.scrollHeight;
      } catch (_) {}
    }

    function showNotice(text, type) {
      pfNotice.textContent = text || "";
      pfNotice.className   = type ? (type === "error" ? "error" : type === "warn" ? "warn" : "") : "";
    }

    function setDebugFields() {
      dbgCustom.textContent    = customId;
      dbgPlayFabId.textContent = playFabId || "-";
      dbgTicket.textContent    = sessionTicket ? "[present]" : "-";
      dbgStatus.textContent    = lastResponse
        ? lastResponse.status + (lastResponse.tag ? " (" + lastResponse.tag + ")" : "")
        : "-";
    }

    // ── pfPost — fetch com retry em 401 ────────────────────────────────────
    async function pfPost(endpoint, body, ticket, opts = {}) {
      const tag = opts.tag || "";

      const makeRequest = async (tk) => {
        const url     = BASE_URL + endpoint;
        const headers = { "Content-Type": "application/json" };
        if (tk) headers["X-Authorization"] = tk;
        try {
          log("[PlayFab JS] POST", url, "tag:", tag);
          const resp = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
          let json = null;
          try { json = await resp.json(); } catch (_) {}
          lastResponse = { status: resp.status, json, endpoint, tag };
          setDebugFields();
          log(`[PlayFab JS] ${endpoint} → ${resp.status}`, json);
          return { status: resp.status, json };
        } catch (err) {
          lastResponse = { status: 0, error: String(err), endpoint };
          setDebugFields();
          log("[PlayFab JS] Fetch error", err);
          return { status: 0, json: null, error: err };
        }
      };

      let r = await makeRequest(ticket);

      // Re-login automático em caso de 401 (uma única tentativa)
      if (r.status === 401 && !opts._retried) {
        log("[PlayFab JS] 401 — tentando re-login automático...");
        await login(customId, { silent: true });
        opts._retried = true;
        r = await makeRequest(sessionTicket);
      }
      return r;
    }

    // ── callAs3 — tenta chamar callback no SWF via ExternalInterface ────────
    function callAs3IfAvailable(fnName, argObj) {
      try {
        const arg  = JSON.stringify(argObj || {});
        if (typeof window[fnName] === "function") { window[fnName](arg); return true; }
        const elem = document.getElementById("game");
        if (elem && typeof elem[fnName] === "function") { elem[fnName](arg); return true; }
        if (window.parent && typeof window.parent[fnName] === "function") {
          window.parent[fnName](arg); return true;
        }
      } catch (err) {
        console.warn("[PlayFab JS] callAs3IfAvailable:", err);
      }
      return false;
    }

    // ── Overlay do leaderboard ──────────────────────────────────────────────
    function showLeaderboardOverlay(entries) {
      if (!entries || entries.length === 0) {
        overlayText.textContent = "Nenhum resultado.";
      } else {
        overlayText.textContent = entries.map((e, i) => {
          const name = e.DisplayName || e.PlayFabId || "id";
          const val  = e.StatValue !== undefined ? e.StatValue : (e.Value !== undefined ? e.Value : 0);
          return (i + 1) + ". " + name + " — " + val;
        }).join("\n");
      }
      overlay.style.display = "flex";
    }

    // ── login ───────────────────────────────────────────────────────────────
    async function login(cid, opts = {}) {
      if (isLoggingIn) {
        log("[PlayFab JS] login já em andamento, aguardando...");
        return { status: 0, json: { errorMessage: "LoginInProgress" } };
      }
      isLoggingIn = true;
      if (!opts.silent) showNotice("Conectando ao PlayFab...", "");

      try {
        if (cid) { customId = cid; setStorage("pf_customId", customId); setDebugFields(); }

        const body = {
          TitleId:    ORIGINAL_TITLE_ID,
          CustomId:   customId,
          CreateAccount: true,
          InfoRequestParameters: { GetUserAccountInfo: true }
        };
        const r = await pfPost("/Client/LoginWithCustomID", body, null, { tag: "login" });

        // Criação de conta desabilitada (errorCode 22000)
        if (r.status === 400 && r.json && r.json.errorCode === 22000) {
          log("[PlayFab JS] Criação de contas desabilitada (22000).");
          showNotice("Criação de contas desabilitada para este título. Habilite no Game Manager.", "error");
          callAs3IfAvailable("onPlayFabLogin", { ok: false, errorCode: 22000, errorMessage: r.json.errorMessage || "PlayerCreationDisabled" });
          isLoggingIn = false;
          return r;
        }

        if (r.status === 200 && r.json && r.json.data) {
          sessionTicket = r.json.data.SessionTicket || "";
          playFabId     = r.json.data.PlayFabId || "";
          callAs3IfAvailable("onPlayFabLogin", { ok: true, data: r.json.data });
          setDebugFields();
          if (!opts.silent) showNotice("Conectado — PlayFabId: " + (playFabId || "-"), "");
          // Busca dados do usuário em background (não bloqueia)
          getUserData().catch(() => {});
        } else {
          sessionTicket = "";
          playFabId     = "";
          callAs3IfAvailable("onPlayFabLogin", { ok: false, error: r.json || { status: r.status } });
          setDebugFields();
          if (!opts.silent) showNotice("Falha no login (veja os logs).", "error");
          log("[PlayFab JS] login falhou", r);
        }

        isLoggingIn = false;
        return r;
      } catch (err) {
        isLoggingIn = false;
        log("[PlayFab JS] login exception", err);
        callAs3IfAvailable("onPlayFabLogin", { ok: false, error: String(err) });
        if (!opts.silent) showNotice("Erro de rede ao conectar.", "error");
        return { status: 0, error: err };
      }
    }

    // ── submitScore ─────────────────────────────────────────────────────────
    async function submitScore(score, kills, level) {
      const body = {
        Statistics: [
          { StatisticName: "Score", Value: parseInt(score  || 0) },
          { StatisticName: "Kills", Value: parseInt(kills  || 0) },
          { StatisticName: "Level", Value: parseInt(level  || 0) }
        ]
      };
      const r = await pfPost("/Client/UpdatePlayerStatistics", body, sessionTicket, { tag: "submitScore" });
      callAs3IfAvailable("onSubmitScoreResult", { status: r.status, json: r.json });
      return r;
    }

    // ── getTopN ─────────────────────────────────────────────────────────────
    async function getTopN(statName, n) {
      const body = { StatisticName: statName, StartPosition: 0, MaxResultsCount: n };
      const r    = await pfPost("/Client/GetLeaderboard", body, sessionTicket, { tag: "getTopN" });
      if (r.status === 200 && r.json && r.json.data && r.json.data.Leaderboard) {
        const entries = r.json.data.Leaderboard;
        callAs3IfAvailable("onLeaderboardResult", { ok: true, entries });
        showLeaderboardOverlay(entries);
        showNotice("Leaderboard carregado.", "");
      } else {
        callAs3IfAvailable("onLeaderboardResult", { ok: false, error: r.json || { status: r.status } });
        log("[PlayFab JS] getTopN falhou", r);
        showNotice("Falha ao carregar leaderboard (veja logs).", "warn");
      }
      return r;
    }

    // ── setDisplayName ──────────────────────────────────────────────────────
    async function setDisplayName(displayName) {
      // Se não tem ticket, faz login primeiro
      if (!sessionTicket) {
        log("[PlayFab JS] Sem sessionTicket — logando antes de salvar nome...");
        showNotice("Autenticando antes de salvar o nome...", "");
        const loginRes = await login(customId);
        if (!loginRes || loginRes.status !== 200) {
          log("[PlayFab JS] Não foi possível salvar nome: login falhou", loginRes);
          callAs3IfAvailable("onSetDisplayNameResult", { status: 0, error: "LoginFailed" });
          showNotice("Não foi possível autenticar para salvar o nome.", "error");
          return loginRes || { status: 0 };
        }
      }

      const body = { DisplayName: String(displayName) };
      const r    = await pfPost("/Client/UpdateUserTitleDisplayName", body, sessionTicket, { tag: "setDisplayName" });

      if (r && r.status === 200) {
        showNotice("Nome salvo com sucesso!", "");
      } else if (r && r.status === 401) {
        showNotice("Sessão inválida — tentando reautenticar...", "warn");
      } else {
        showNotice("Erro ao salvar nome (status " + (r ? r.status : "?") + ").", "error");
      }

      callAs3IfAvailable("onSetDisplayNameResult", { status: r.status, json: r.json });
      return r;
    }

    // ── getUserData / saveUserData ───────────────────────────────────────────
    async function getUserData() {
      const r = await pfPost("/Client/GetUserData", {}, sessionTicket, { tag: "getUserData" });
      if (r.status === 200 && r.json && r.json.data) {
        callAs3IfAvailable("onUserDataResult", { ok: true, data: r.json.data.Data || {} });
      } else {
        callAs3IfAvailable("onUserDataResult", { ok: false, error: r.json || { status: r.status } });
      }
      return r;
    }

    async function saveUserData(key, value) {
      const body = { Data: { [key]: String(value) } };
      const r    = await pfPost("/Client/UpdateUserData", body, sessionTicket, { tag: "saveUserData" });
      callAs3IfAvailable("onSaveUserDataResult", { status: r.status, json: r.json });
      return r;
    }

    // ── Exposição global (chamadas do AS3 via ExternalInterface) ────────────
    window.playfabLoginFromPage  = (cid)                 => login(cid);
    window.playfabSubmitScore    = (score, kills, level) => submitScore(score, kills, level);
    window.playfabGetTopN        = (statName, n)         => getTopN(statName, n);
    window.playfabSetDisplayName = (displayName)         => setDisplayName(displayName);
    window.playfabSaveUserData   = (key, value)          => saveUserData(key, value);
    window.playfabGetUserData    = ()                    => getUserData();

    // Helpers de debug via console
    window._pf_debug = {
      getSessionTicket: () => sessionTicket,
      getPlayFabId:     () => playFabId,
      getCustomId:      () => customId,
      lastResponse:     () => lastResponse
    };

    // ✅ JS-2 CORRIGIDO — auto-login REMOVIDO do window.load.
    // O AS3 já chama window.playfabLoginFromPage() via ExternalInterface.call()
    // em playfabBootLogin(). Deixar os dois causaria condição de corrida.
    // Se precisar testar o painel sem o SWF, use o botão "Forçar Login".

    // ── Botões do painel de debug ───────────────────────────────────────────
    document.getElementById("btnForceLogin").addEventListener("click", () => login(customId));
    document.getElementById("btnGetTop10")  .addEventListener("click", () => getTopN("Score", 10));
    document.getElementById("btnClearLog")  .addEventListener("click", () => { pfLog.value = ""; });

    // Estado inicial do painel
    setDebugFields();
    showNotice("Painel pronto. O SWF fará login automaticamente ao carregar.", "");

  })();
  </script>
</body>
</html>
