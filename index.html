<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Hunter Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .frame {
      width: 800px;
      height: 600px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      border: 1px solid #222;
      background: #000;
    }
    .hint {
      margin-top: 10px;
      opacity: .85;
      font-size: 14px;
      text-align: center;
    }

    /* overlay leaderboard */
    #pfOverlay {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      z-index: 9999;
    }
    #pfOverlayBox {
      width: 360px;
      max-height: 80vh;
      overflow: auto;
      background: #111;
      border: 2px solid #444;
      padding: 14px;
      color: #fff;
      font-family: monospace;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    #pfOverlayBox h3 { margin:0 0 8px 0; font-size:16px; }
    #pfOverlayBox pre { white-space: pre-wrap; margin:0; font-size:13px; }
    #pfOverlayBox button { padding:6px 10px; }
    @media (max-width:820px) {
      .frame { width: 100%; height: auto; aspect-ratio: 4/3; }
    }
  </style>
</head>
<body>
  <div class="frame" id="game-container"></div>
  <div class="hint">Click on the game to play and use the keyboard (Enter = Start, Arrow keys = Move, Space = Shoot, P = Pause)</div>

  <!-- overlay fallback for leaderboard -->
  <div id="pfOverlay">
    <div id="pfOverlayBox">
      <h3>Leaderboard (online)</h3>
      <pre id="pfOverlayText">Carregando...</pre>
      <div style="text-align:right;margin-top:8px;">
        <button id="pfOverlayClose">Fechar</button>
      </div>
    </div>
  </div>

  <script>
  window.addEventListener("DOMContentLoaded", () => {
    const ruffle = window.RufflePlayer && window.RufflePlayer.newest ? window.RufflePlayer.newest() : null;
    const container = document.getElementById("game-container");
    if (!ruffle) {
      container.innerHTML = "Não foi possível carregar o Ruffle. Verifique sua conexão com a Internet.";
      return;
    }
    const player = ruffle.createPlayer();
    player.id = "game"; // importante para ponte com AS3/Ruffle
    container.appendChild(player);
    player.style.width = "100%";
    player.style.height = "100%";
    player.tabIndex = 0;
    setTimeout(()=>{ try{ player.focus(); }catch(e){} }, 500);
    container.addEventListener("click", ()=> { try{ player.focus(); }catch(e){} });

    // carregue seu SWF (coloque rocket_game.swf no mesmo diretório)
    player.load("rocket_game.swf");
  });

  (function(){
    const TITLE_ID = "1D2BB9"; // ajuste se necessário
    const BASE_URL = "https://" + TITLE_ID + ".playfabapi.com";

    // state
    let sessionTicket = "";
    let playFabId = "";
    let customId = localStorage.getItem("pf_customId") || ("player_" + Math.floor(Math.random()*99999999));
    localStorage.setItem("pf_customId", customId);

    // overlay elements
    const overlay = document.getElementById("pfOverlay");
    const overlayText = document.getElementById("pfOverlayText");
    document.getElementById("pfOverlayClose").addEventListener("click", ()=> overlay.style.display = "none");

    // helper pfPost
    async function pfPost(endpoint, body, ticket) {
      const url = BASE_URL + endpoint;
      const headers = { "Content-Type": "application/json" };
      if (ticket) headers["X-Authorization"] = ticket;
      const resp = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
      const json = await resp.json().catch(()=>null);
      return { status: resp.status, json: json };
    }

    // helper: call AS3 if available (tries window, element id 'game', parent)
    function callAs3IfAvailable(fnName, arg) {
      try {
        if (typeof window[fnName] === "function") { window[fnName](JSON.stringify(arg)); return true; }
        const elem = document.getElementById("game");
        if (elem && typeof elem[fnName] === "function") { try { elem[fnName](JSON.stringify(arg)); return true; } catch(_){} }
        if (typeof window.parent[fnName] === "function") { window.parent[fnName](JSON.stringify(arg)); return true; }
      } catch (err) { console.warn("[PlayFab JS] callAs3IfAvailable error:", err); }
      return false;
    }

    function showLeaderboardOverlay(entries) {
      if (!entries || entries.length === 0) { overlayText.textContent = "Nenhum resultado."; }
      else {
        let out = "";
        for (let i=0;i<entries.length;i++) {
          const e = entries[i];
          const name = e.DisplayName || e.PlayFabId || "id";
          const val = (e.StatValue !== undefined) ? e.StatValue : (e.Value !== undefined ? e.Value : 0);
          out += (i+1) + ". " + name + " — " + val + "\n";
        }
        overlayText.textContent = out;
      }
      overlay.style.display = "flex";
    }

    // Login
    async function login(custom) {
      if (custom) {
        customId = custom;
        localStorage.setItem("pf_customId", customId);
      }
      try {
        const body = {
          TitleId: TITLE_ID,
          CustomId: customId,
          CreateAccount: true,
          InfoRequestParameters: { GetUserAccountInfo: true }
        };
        const r = await pfPost("/Client/LoginWithCustomID", body, null);
        console.log("[PlayFab JS] login status", r.status, r.json);
        if (r.status === 200 && r.json && r.json.data) {
          sessionTicket = r.json.data.SessionTicket || "";
          playFabId = r.json.data.PlayFabId || "";
          callAs3IfAvailable("onPlayFabLogin", { ok:true, data: r.json.data });
          // optionally fetch user data and leaderboard after login
          try { getUserData(); } catch(_) {}
          return r;
        } else {
          callAs3IfAvailable("onPlayFabLogin", { ok:false, error: r.json || { status:r.status } });
          return r;
        }
      } catch (err) {
        console.error("[PlayFab JS] login error", err);
        callAs3IfAvailable("onPlayFabLogin", { ok:false, error: String(err) });
        return { status:0, json:null };
      }
    }

    // submit score
    async function submitScore(score, kills, level) {
      try {
        if (!sessionTicket) { console.warn("[PlayFab JS] submitScore: no sessionTicket"); return { status:0 }; }
        const body = { Statistics: [
          { StatisticName:"Score", Value: parseInt(score||0) },
          { StatisticName:"Kills", Value: parseInt(kills||0) },
          { StatisticName:"Level", Value: parseInt(level||0) }
        ] };
        const r = await pfPost("/Client/UpdatePlayerStatistics", body, sessionTicket);
        console.log("[PlayFab JS] submit status", r.status, r.json);
        callAs3IfAvailable("onSubmitScoreResult", { status: r.status, json: r.json });
        return r;
      } catch (err) {
        console.error("[PlayFab JS] submitScore error", err);
        callAs3IfAvailable("onSubmitScoreResult", { status:0, error:String(err) });
        return { status:0 };
      }
    }

    // get top N leaderboard
    async function getTopN(statName, n) {
      try {
        if (!sessionTicket) { console.warn("[PlayFab JS] getTopN: no sessionTicket"); callAs3IfAvailable("onLeaderboardResult", { ok:false, error:"NoSessionTicket" }); return { status:0 }; }
        const body = { StatisticName: statName, StartPosition: 0, MaxResultsCount: n };
        const r = await pfPost("/Client/GetLeaderboard", body, sessionTicket);
        console.log("[PlayFab JS] leaderboard status", r.status, r.json);
        if (r.status === 200 && r.json && r.json.data && r.json.data.Leaderboard) {
          callAs3IfAvailable("onLeaderboardResult", { ok:true, entries: r.json.data.Leaderboard });
          showLeaderboardOverlay(r.json.data.Leaderboard);
        } else {
          callAs3IfAvailable("onLeaderboardResult", { ok:false, error: r.json || { status:r.status } });
        }
        return r;
      } catch (err) {
        console.error("[PlayFab JS] getTopN error", err);
        callAs3IfAvailable("onLeaderboardResult", { ok:false, error:String(err) });
        return { status:0 };
      }
    }

    // set display name
    async function setDisplayName(displayName) {
      try {
        if (!sessionTicket) { console.warn("[PlayFab JS] no sessionTicket"); callAs3IfAvailable("onSetDisplayNameResult", { status:0 }); return { status:0 }; }
        const body = { DisplayName: String(displayName) };
        const r = await pfPost("/Client/UpdateUserTitleDisplayName", body, sessionTicket);
        console.log("[PlayFab JS] setDisplayName", r.status, r.json);
        callAs3IfAvailable("onSetDisplayNameResult", { status: r.status, json: r.json });
        return r;
      } catch (err) {
        console.error("[PlayFab JS] setDisplayName error", err);
        callAs3IfAvailable("onSetDisplayNameResult", { status:0, error:String(err) });
        return { status:0 };
      }
    }

    // save arbitrary user data (not used now, kept for future)
    async function saveUserData(key, value) {
      try {
        if (!sessionTicket) { console.warn("[PlayFab JS] no sessionTicket"); return { status:0 }; }
        var body = { Data: {} };
        body.Data[key] = String(value);
        const r = await pfPost("/Client/UpdateUserData", body, sessionTicket);
        console.log("[PlayFab JS] saveUserData", r.status, r.json);
        callAs3IfAvailable("onSaveUserDataResult", { status: r.status, json: r.json });
        return r;
      } catch (err) {
        console.error("[PlayFab JS] saveUserData error", err);
        callAs3IfAvailable("onSaveUserDataResult", { status:0, error:String(err) });
        return { status:0 };
      }
    }

    // get user data
    async function getUserData() {
      try {
        if (!sessionTicket) { console.warn("[PlayFab JS] no sessionTicket"); callAs3IfAvailable("onUserDataResult", { ok:false, error:"NoSessionTicket" }); return { status:0 }; }
        const r = await pfPost("/Client/GetUserData", {}, sessionTicket);
        console.log("[PlayFab JS] getUserData", r.status, r.json);
        if (r.status === 200 && r.json && r.json.data) {
          const data = r.json.data.Data || {};
          callAs3IfAvailable("onUserDataResult", { ok:true, data: data });
        } else {
          callAs3IfAvailable("onUserDataResult", { ok:false, error: r.json || { status:r.status } });
        }
        return r;
      } catch (err) {
        console.error("[PlayFab JS] getUserData error", err);
        callAs3IfAvailable("onUserDataResult", { ok:false, error:String(err) });
        return { status:0 };
      }
    }

    // Expose global functions for AS3 (ExternalInterface.call)
    window.playfabLoginFromPage = (cid) => { return login(cid); };
    window.playfabSubmitScore = (score,kills,level) => submitScore(score,kills,level);
    window.playfabGetTopN = (statName,n) => getTopN(statName,n);
    window.playfabSetDisplayName = (displayName) => setDisplayName(displayName);
    window.playfabSaveUserData = (key,value) => saveUserData(key,value);
    window.playfabGetUserData = () => getUserData();

    // Auto-login on page load
    window.addEventListener('load', function(){ login(); });

    // expose callAs3IfAvailable for potential debugging
    window._pf_debug = { getSessionTicket: ()=> sessionTicket, getPlayFabId: ()=> playFabId, getCustomId: ()=> customId };

  })();
  </script>
</body>
</html>
