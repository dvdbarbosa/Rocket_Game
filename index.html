<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hunter Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    #game-container {
      width:800px;
      height:600px;
      background:#000;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- Ruffle: tenta unpkg, fallback jsdelivr -->
  <script>
    (function() {
      var cdns = [
        "https://unpkg.com/@ruffle-rs/ruffle",
        "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"
      ];
      var idx = 0;
      function tryLoad() {
        if (idx >= cdns.length) {
          document.getElementById("game-container").innerHTML =
            "<p style='color:#f66;padding:20px;font-family:sans-serif'>" +
            "Failed to load Ruffle. Please check your connection.</p>";
          return;
        }
        var s = document.createElement("script");
        s.src = cdns[idx];
        s.onload  = function() { console.log("[Ruffle] Loaded from:", cdns[idx]); };
        s.onerror = function() { console.warn("[Ruffle] Failed:", cdns[idx]); idx++; tryLoad(); };
        document.head.appendChild(s);
      }
      tryLoad();
    })();
  </script>

  <!-- PlayFab -->
  <script>
  (function() {
    const ORIGINAL_TITLE_ID = "15AC49";
    const TITLE_ID          = ORIGINAL_TITLE_ID.toLowerCase();
    const BASE_URL          = "https://" + TITLE_ID + ".playfabapi.com";

    // Storage com fallback
    function getStorage(key) {
      try { return localStorage.getItem(key); } catch(_) {}
      try { return sessionStorage.getItem(key); } catch(_) {}
      return null;
    }
    function setStorage(key, val) {
      try { localStorage.setItem(key, val); return; } catch(_) {}
      try { sessionStorage.setItem(key, val); } catch(_) {}
    }

    // Estado
    var sessionTicket = "";
    var playFabId     = "";
    var customId      = getStorage("pf_customId") || ("player_" + Math.floor(Math.random() * 99999999));
    setStorage("pf_customId", customId);
    var isLoggingIn   = false;
    var lastResponse  = null;

    // ── Fetch com retry em 401 ──────────────────────────────────────────────
    async function pfPost(endpoint, body, ticket, opts) {
      opts = opts || {};
      var makeRequest = async function(tk) {
        var url     = BASE_URL + endpoint;
        var headers = { "Content-Type": "application/json" };
        if (tk) headers["X-Authorization"] = tk;
        try {
          var resp = await fetch(url, { method:"POST", headers:headers, body:JSON.stringify(body) });
          var json = null;
          try { json = await resp.json(); } catch(_) {}
          lastResponse = { status: resp.status, json: json, endpoint: endpoint };
          console.log("[PlayFab]", endpoint, "→", resp.status);
          return { status: resp.status, json: json };
        } catch(err) {
          console.error("[PlayFab] Fetch error:", err);
          return { status: 0, json: null, error: err };
        }
      };

      var r = await makeRequest(ticket);
      if (r.status === 401 && !opts._retried) {
        console.log("[PlayFab] 401 — re-login...");
        await login(customId, { silent: true });
        opts._retried = true;
        r = await makeRequest(sessionTicket);
      }
      return r;
    }

    // ── Chama callback no SWF ───────────────────────────────────────────────
    function callAs3(fnName, argObj) {
      try {
        var arg  = JSON.stringify(argObj || {});
        if (typeof window[fnName] === "function") { window[fnName](arg); return true; }
        var elem = document.getElementById("game");
        if (elem && typeof elem[fnName] === "function") { elem[fnName](arg); return true; }
      } catch(err) {
        console.warn("[PlayFab] callAs3 error:", fnName, err);
      }
      return false;
    }

    // ── Login ───────────────────────────────────────────────────────────────
    async function login(cid, opts) {
      opts = opts || {};
      if (isLoggingIn) return { status:0 };
      isLoggingIn = true;
      try {
        if (cid) { customId = cid; setStorage("pf_customId", customId); }
        var body = {
          TitleId: ORIGINAL_TITLE_ID,
          CustomId: customId,
          CreateAccount: true,
          InfoRequestParameters: { GetUserAccountInfo: true }
        };
        var r = await pfPost("/Client/LoginWithCustomID", body, null, { tag:"login" });

        if (r.status === 400 && r.json && r.json.errorCode === 22000) {
          console.error("[PlayFab] Account creation disabled (22000).");
          callAs3("onPlayFabLogin", { ok:false, errorCode:22000 });
          isLoggingIn = false;
          return r;
        }

        if (r.status === 200 && r.json && r.json.data) {
          sessionTicket = r.json.data.SessionTicket || "";
          playFabId     = r.json.data.PlayFabId     || "";
          callAs3("onPlayFabLogin", { ok:true, data: r.json.data });
        } else {
          sessionTicket = ""; playFabId = "";
          callAs3("onPlayFabLogin", { ok:false, error: r.json || { status:r.status } });
        }
        isLoggingIn = false;
        return r;
      } catch(err) {
        isLoggingIn = false;
        callAs3("onPlayFabLogin", { ok:false, error: String(err) });
        return { status:0, error:err };
      }
    }

    // ── Submit Score ────────────────────────────────────────────────────────
    async function submitScore(score, kills, level) {
      var body = { Statistics: [
        { StatisticName:"Score", Value: parseInt(score  || 0) },
        { StatisticName:"Kills", Value: parseInt(kills  || 0) },
        { StatisticName:"Level", Value: parseInt(level  || 0) }
      ]};
      var r = await pfPost("/Client/UpdatePlayerStatistics", body, sessionTicket, { tag:"submitScore" });
      callAs3("onSubmitScoreResult", { status: r.status, json: r.json });
      return r;
    }

    // ── Leaderboard ─────────────────────────────────────────────────────────
    async function getTopN(statName, n) {
      var body = { StatisticName: statName, StartPosition: 0, MaxResultsCount: n };
      var r    = await pfPost("/Client/GetLeaderboard", body, sessionTicket, { tag:"getTopN" });
      if (r.status === 200 && r.json && r.json.data && r.json.data.Leaderboard) {
        callAs3("onLeaderboardResult", { ok:true, entries: r.json.data.Leaderboard });
      } else {
        callAs3("onLeaderboardResult", { ok:false, error: r.json || { status:r.status } });
      }
      return r;
    }

    // ── Set Display Name ────────────────────────────────────────────────────
    async function setDisplayName(displayName) {
      if (!sessionTicket) {
        var lr = await login(customId);
        if (!lr || lr.status !== 200) {
          callAs3("onSetDisplayNameResult", { status:0, error:"LoginFailed" });
          return lr || { status:0 };
        }
      }
      var body = { DisplayName: String(displayName) };
      var r    = await pfPost("/Client/UpdateUserTitleDisplayName", body, sessionTicket, { tag:"setDisplayName" });
      callAs3("onSetDisplayNameResult", { status: r.status, json: r.json });
      return r;
    }

    // ── Save / Get User Data ────────────────────────────────────────────────
    async function saveUserData(key, value) {
      var body = { Data: {} };
      body.Data[key] = String(value);
      var r = await pfPost("/Client/UpdateUserData", body, sessionTicket, { tag:"saveUserData" });
      callAs3("onSaveUserDataResult", { status: r.status, json: r.json });
      return r;
    }
    async function getUserData() {
      var r = await pfPost("/Client/GetUserData", {}, sessionTicket, { tag:"getUserData" });
      if (r.status === 200 && r.json && r.json.data)
        callAs3("onUserDataResult", { ok:true, data: r.json.data.Data || {} });
      else
        callAs3("onUserDataResult", { ok:false, error: r.json || { status:r.status } });
      return r;
    }

    // ── Exposição global para o AS3 ─────────────────────────────────────────
    window.playfabLoginFromPage  = function(cid)                 { return login(cid); };
    window.playfabSubmitScore    = function(score, kills, level) { return submitScore(score, kills, level); };
    window.playfabGetTopN        = function(statName, n)         { return getTopN(statName, n); };
    window.playfabSetDisplayName = function(displayName)         { return setDisplayName(displayName); };
    window.playfabSaveUserData   = function(key, value)          { return saveUserData(key, value); };
    window.playfabGetUserData    = function()                    { return getUserData(); };

    // Debug via console (F12)
    window._pf = {
      getTicket:  function() { return sessionTicket; },
      getId:      function() { return playFabId; },
      getCustomId:function() { return customId; },
      last:       function() { return lastResponse; }
    };

  })();
  </script>

  <!-- Ruffle: inicializa o player e carrega main.swf -->
  <script>
    function initRuffle() {
      var container = document.getElementById("game-container");
      if (!container) return;

      if (window.RufflePlayer && window.RufflePlayer.newest) {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        player.id           = "game";
        player.style.width  = "100%";
        player.style.height = "100%";
        player.tabIndex     = 0;
        container.innerHTML = "";
        container.appendChild(player);

        setTimeout(function() { try { player.focus(); } catch(_) {} }, 500);
        container.addEventListener("click", function() { try { player.focus(); } catch(_) {} });

        player.load({
          url: "main.swf",
          parameters: {},
          config: {
            preferredRenderer: "canvas",
            warnOnUnsupportedContent: false,
            logLevel: "error",
            quality: "medium"
          }
        });

        console.log("[Ruffle] main.swf loading...");
      } else {
        container.innerHTML =
          "<p style='color:#f66;padding:20px;font-family:sans-serif'>" +
          "Ruffle not loaded yet. Please refresh the page.</p>";
      }
    }

    // Aguarda Ruffle carregar (até 8s)
    document.addEventListener("DOMContentLoaded", function() {
      var waited  = 0;
      var interval = setInterval(function() {
        waited += 200;
        if (window.RufflePlayer && window.RufflePlayer.newest) {
          clearInterval(interval);
          initRuffle();
        } else if (waited >= 8000) {
          clearInterval(interval);
          initRuffle();
        }
      }, 200);
    });
  </script>

</body>
</html>
